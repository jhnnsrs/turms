name: Release with uv and semantic-release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv and set Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - uses: pyvista/setup-headless-display-action@v3
        with:
          qt: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest tests

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release version

      # `semantic-release version` only builds when it actually cuts a release,
      # so an empty `dist/` means this push carried nothing releasable (a
      # `build:`/`chore:`/`docs:`-only change). Both steps are guarded on that:
      # unguarded, `uv publish` fails the job on every such push.
      - name: Check whether a release was cut
        id: built
        run: echo "any=${{ hashFiles('dist/**') != '' }}" >> "$GITHUB_OUTPUT"

      - name: Publish to Releases
        if: steps.built.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run semantic-release publish

      - name: Publish to Pypi
        if: steps.built.outputs.any == 'true'
        run: uv publish
