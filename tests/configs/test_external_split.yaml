# Two projects over one schema: the first owns the wire vocabulary, the second
# generates fragments and operations that import it.
projects:
  beasts_protocol:
    schema: schemas/beasts.graphql
    extensions:
      turms:
        out_dir: examples/protocol
        stylers:
          - type: turms.stylers.capitalize.CapitalizeStyler
          - type: turms.stylers.snake_case.SnakeCaseStyler
        plugins:
          - type: turms.plugins.enums.EnumsPlugin
            skip_unreferenced: false
          - type: turms.plugins.inputs.InputsPlugin
            skip_unreferenced: false

  beasts:
    schema: schemas/beasts.graphql
    documents: documents/beasts/*.graphql
    extensions:
      turms:
        out_dir: examples/api
        external_modules:
          - module: examples.protocol.schema
            kinds: [enum, input]
            from_project: beasts_protocol
        stylers:
          - type: turms.stylers.capitalize.CapitalizeStyler
          - type: turms.stylers.snake_case.SnakeCaseStyler
        plugins:
          - type: turms.plugins.fragments.FragmentsPlugin
          - type: turms.plugins.operations.OperationsPlugin
