# @oneOf is built-in in graphql-core 3.3+ but must be declared for 3.2 compatibility
directive @oneOf on INPUT_OBJECT

type Query {
  findUser(input: FindUserInput!): User
  searchContent(filter: SearchFilter!): [Content]
  findPet(pet: PetInput!): Pet
}

type User {
  id: ID!
  email: String!
  username: String!
}

type Content {
  id: ID!
  title: String!
}

"""Find a user by exactly one identifier"""
input FindUserInput @oneOf {
  id: ID
  email: String
  username: String
}

"""Search content by exactly one filter"""
input SearchFilter @oneOf {
  title: String
  authorId: ID
}

type Pet {
  id: ID!
  name: String!
}

input CatInput {
  name: String!
  meow: Boolean
}

input DogInput {
  name: String!
  bark: Boolean
}

"""A pet, expressed as a tagged input union"""
input PetInput @oneOf {
  cat: CatInput
  dog: DogInput
}
