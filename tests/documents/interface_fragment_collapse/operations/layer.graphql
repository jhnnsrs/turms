# Spreads an interface fragment into a field whose type is a concrete
# implementation (ImageLayer). The single-item collapse must resolve to the
# implementation class (LayerImageLayer), not the bare interface fragment name.
mutation CreateLayer($name: String!) {
  createLayer(name: $name) {
    ...Layer
  }
}

# Same collapse but with an additional field selected alongside the interface
# fragment, exercising the additional-bases (inheritance) path.
mutation CreateLayerWithStatus($name: String!) {
  createLayer(name: $name) {
    ...Layer
    status
  }
}

# Spreads the interface fragment into a field that is genuinely the interface,
# which must still produce the discriminated union.
query GetLayer($id: ID!) {
  layer(id: $id) {
    ...Layer
  }
}

# Exercises the generated interface fragment implementations.
query GetLayerFull($id: ID!) {
  layer(id: $id) {
    ...LayerFull
  }
}

# Exercises recurse.py directly without a named interface fragment.
query GetInlineLayerFull($id: ID!) {
  layer(id: $id) {
    ... on ImageLayer {
      ...ImageLayerFull
    }
    ... on MeshLayer {
      ...MeshLayerFull
    }
  }
}
