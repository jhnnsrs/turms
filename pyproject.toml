[project]
name = "turms"
version = "1.2.1"
description = "graphql-codegen powered by pydantic"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
    "Topic :: Utilities",
    "Development Status :: 6 - Mature",
]
dependencies = [
    "rich>=11",
    "graphql-core>=3.2.0,<4",
    "pydantic>2",
    "PyYAML>=5.3.0",
    "rich-click>=1.6",
    "pydantic-settings>=2.5.2,<3",
    "watchfiles>=0.18.1",
    "requests>=2.32.3",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
black = ["black>=22.1.0"]
isort = ["isort>=5.10.1"]
ruff = ["ruff>=0.1.0"]
merge = ["libcst>=1.8.0"]

[project.urls]
Homepage = "https://jhnnsrs.github.io/turms"
Repository = "https://github.com/jhnnsrs/turms"

[project.scripts]
turms = "turms.cli.main:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<8",
    "isort>=5.10.1,<7",
    "black>=24.1.0,<26",
    "strawberry-graphql>=0.316.0",
    "libcst>=1.8.0,<2",
    "requests>=2.28.1,<3",
    "pytest-snapshot>=0.9.0,<0.10",
    "python-semantic-release>=9.21.1",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
markers = [
    "network: makes an outbound request, mostly to the rate-limited countries.trevorblades.com schema; deselected on the CI matrix with -m 'not network'",
]

[tool.hatch.build.targets.sdist]
include = ["turms"]

[tool.hatch.build.targets.wheel]
include = ["turms"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = ["turms"]

[tool.pydoc-markdown.renderer]
type = "docusaurus"
docs_base_path = "website/docs"


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
branch = "main"
build_command = "uv build"
